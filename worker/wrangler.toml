name = "alcohol-worker"       # Tên dự án Worker hiển thị trên Cloudflare
main = "worker.js"            # Chỉ thẳng vào file trong cùng thư mục con
compatibility_date = "2026-07-03" # Sử dụng ngày hiện tại làm mốc tương thích

# Liên kết Database D1 SQLite của bạn (Thay thông số thực tế của bạn vào)
[[d1_databases]]
binding = "DB"
database_name = "alcohol-dictionary"
database_id = "604da9e4-f9cf-4f50-8083-7190a006c672"
# 🟢 DÁN THÊM KHAI BÁO KÍCH HOẠT DỊCH VỤ AI NÀY VÀO DƯỚI CÙNG:
[ai]
binding = "AI"
